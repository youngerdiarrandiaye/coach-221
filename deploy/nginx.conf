server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;   # photo de profil (5 Mo) et saisies

  # Sécurité de base (HTTPS est terminé par Coolify/Traefik devant ce conteneur)
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
  # Le hachage autorise le seul gestionnaire onload qu'Angular place sur la feuille de style critique
  # (this.media='all'). Aucun autre script en ligne n'est permis. Les photos de profil viennent du stockage HTTPS.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # API : jamais mise en cache ; les cookies de session restent sur ce domaine
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }
  location /auth/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Les tâches planifiées ne sont jamais exposées au public : elles passent par le réseau interne (scheduler)
  location /api/cron/ { return 404; }

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Modèles d'e-mails de l'authentification (téléchargés par le Supabase à chaque envoi ; publics, sans secret)
  location /mail/ { default_type text/html; add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Application monopage : toute autre adresse renvoie index.html
  location / { try_files $uri $uri/ /index.html; }
}

# Instance Docker dédiée ; ne partage ni base ni ports avec Facture-Fasso.
project_id = "coachsen-local"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4200"
additional_redirect_urls = ["http://127.0.0.1:4200/auth/callback", "http://127.0.0.1:4200/auth/callback?next=/dashboard", "http://127.0.0.1:4200/auth/callback?next=/update-password"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Développement local uniquement : inscription immédiatement utilisable.
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

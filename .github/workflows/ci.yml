name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:   # réutilisé par deploy.yml : rien n'est déployé si ces contrôles échouent

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Aucun secret : les tests tournent sans réseau et sans base distante.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Installer les dépendances du serveur
        run: npm ci
      - name: Vérification des types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (fichier par fichier)
        run: npm test
      - name: Installer les dépendances Angular
        run: npm ci
        working-directory: frontend
      - name: Compiler l'application Angular (sans navigateur)
        run: npm run build
        working-directory: frontend

name: Déploiement

# Chaque envoi sur main : contrôles (ci.yml), construction des 3 images, publication sur GHCR, puis ordre de
# déploiement à Coolify (docker compose sur le VPS), et contrôle que le site répond.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; un déploiement en cours n'est jamais interrompu.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: deploy/api.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
          - name: scheduler
            dockerfile: deploy/scheduler.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes de l'image (identifiant du commit et latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/coachsen-${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # Variables publiques de l'API, lues à la construction : clé anon seulement, jamais la clé de service.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            APP_VERSION=${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environnement GitHub « production » : on peut y exiger une validation manuelle avant chaque déploiement.
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      SITE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4

      - name: Contrôler la configuration
        run: |
          for v in COOLIFY_URL COOLIFY_APP_UUID COOLIFY_API_TOKEN SITE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v manquant (secrets ou variables du dépôt)"; exit 1; }
          done

      - name: Synchroniser le fichier de composition (dépôt vers Coolify)
        run: |
          # Le dépôt est la référence : Coolify garde sa propre copie du compose, mise à jour à chaque déploiement.
          compose=$(base64 -w0 deploy/docker-compose.prod.yml)
          code=$(curl -sS -o /tmp/c.json -w '%{http_code}' -X PATCH "${COOLIFY_URL%/}/api/v1/services/${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "{\"docker_compose_raw\":\"${compose}\"}")
          [ "$code" -lt 300 ] || { echo "::error::Coolify a refusé le fichier de composition (HTTP $code)"; cat /tmp/c.json; exit 1; }
          echo "Fichier de composition synchronisé."

      - name: Fixer la version à déployer (IMAGE_TAG = commit)
        run: |
          tag="${GITHUB_SHA::7}"
          body="{\"key\":\"IMAGE_TAG\",\"value\":\"${tag}\",\"is_preview\":false}"
          auth="Authorization: Bearer ${COOLIFY_API_TOKEN}"
          # CoachSen est une ressource Coolify de type « service » (Docker Compose) ; « applications » en secours.
          ok=0
          for kind in services applications; do
            api="${COOLIFY_URL%/}/api/v1/${kind}/${COOLIFY_APP_UUID}/envs"
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X PATCH "$api" -H "$auth" -H 'Content-Type: application/json' -d "$body")
            if [ "$code" -ge 300 ]; then
              code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST "$api" -H "$auth" -H 'Content-Type: application/json' -d "$body")
            fi
            if [ "$code" -lt 300 ]; then ok=1; break; fi
          done
          [ "$ok" = "1" ] || { echo "::error::Coolify a refusé IMAGE_TAG (HTTP $code)"; cat /tmp/r.json; exit 1; }
          echo "Version : ${tag}"
          # Réglages facultatifs qui vivent dans GitHub (jeton du webhook de mise à jour, serveur d'e-mail du résumé hebdomadaire) :
          # on les recopie dans Coolify pour que l'API les reconnaisse. Un réglage absent est simplement ignoré.
          for name in DEPLOY_WEBHOOK_SECRET SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
            value="${!name:-}"
            [ -n "$value" ] || continue
            json=$(printf '%s' "$value" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')   # valeur échappée pour le JSON
            body=$(printf '{"key":"%s","value":"%s","is_preview":false}' "$name" "$json")
            api="${COOLIFY_URL%/}/api/v1/${kind}/${COOLIFY_APP_UUID}/envs"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH "$api" -H "$auth" -H 'Content-Type: application/json' -d "$body")
            if [ "$code" -ge 300 ]; then code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$api" -H "$auth" -H 'Content-Type: application/json' -d "$body"); fi
            [ "$code" -lt 300 ] || echo "::warning::Coolify a refusé $name (HTTP $code) : ce réglage ne sera pas pris en compte."
          done

      - name: Déclencher le déploiement dans Coolify
        run: |
          # Coolify 4.4.x : l'appel de déploiement est en POST (le GET répond 405).
          curl -fsS -X POST -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H 'Accept: application/json' \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"

      - name: Attendre que le site réponde
        run: |
          # /api/v1/auth/session répond 200 sans connexion : il traverse Nginx, l'API et Supabase.
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${SITE_URL%/}/api/v1/auth/session" || true)
            home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${SITE_URL%/}/" || true)
            echo "essai $i : site=$home api=$api"
            if [ "$home" = "200" ] && [ "$api" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Le site ne répond pas correctement après 5 minutes : voir les journaux Coolify, puis revenir à la version précédente (docs/DEPLOIEMENT_COOLIFY.md, section 4)."
          exit 1

      - name: Vérifier la version en ligne
        run: |
          # /version.json est écrit à la construction de l'image web : il doit porter le commit qu'on vient de déployer.
          for i in $(seq 1 12); do
            live=$(curl -s --max-time 10 "${SITE_URL%/}/version.json" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            echo "essai $i : version en ligne=${live:-aucune} attendue=${GITHUB_SHA}"
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "::error::La version en ligne ne correspond pas au commit déployé : l'ancien conteneur web tourne peut-être encore."
          exit 1

      - name: Prévenir les applications installées (webhook de mise à jour)
        # Secondaire : un échec n'annule pas un déploiement réussi. Sans DEPLOY_WEBHOOK_SECRET, l'étape est ignorée.
        continue-on-error: true
        run: |
          if [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then echo "DEPLOY_WEBHOOK_SECRET absent : annonce de mise à jour ignorée (les applications se mettent à jour à leur prochaine ouverture)."; exit 0; fi
          code=$(curl -sS -o /tmp/hook.json -w '%{http_code}' --max-time 60 -X POST "${SITE_URL%/}/api/deploy-hook" \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" -H 'Content-Type: application/json' \
            -d "{\"version\":\"${GITHUB_SHA}\"}")
          echo "webhook : HTTP $code"; cat /tmp/hook.json; echo
          [ "$code" = "200" ]
